				<h2><u>CONTACTS</u></h2><br>
				
				<h2></h2>
				
				<h2 ><div class="just3">
                Since the dawn of computing, the 
				complexity of software and the criticality 
				of systems reliant on software have 
				grown at a staggering rate. In particular, 
				software-intensive systems have been 
				rapidly evolved from being stand-alone 
				systems in the past, to being part of 
				networked systems in the present, to 
				becoming Systems-of-Systems (SoS) in 
				the coming future. 
				This workshop will provide researchers 
				and practitioners with a forum to 
				exchange ideas and experiences, analyze 
				research & development issues, discuss 
				promising solutions, and propose 
				inspiring visions for the future in the field 
				of Software Engineering (SE) for 
				Systems-of-Systems (SoS). The aim of 
				this first edition is to set up a research 
				agenda and lay the foundations for future 
				developments in the SE for SoS.
				</div></h2>
